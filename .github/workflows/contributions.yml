name: Update contribution graph data

on:
  schedule:
    - cron: '17 3 * * 0'   # weekly, Sunday 03:17 UTC, trigger deploy.yml
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Fetch contribution calendar
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GITHUB_LOGIN: NCMBianchi
          GITEA_URL: ${{ secrets.GITEA_URL }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: cargo run --release --manifest-path tools/contrib-graph/Cargo.toml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/contributions.json
          git diff --cached --quiet || git commit -m "chore: update contribution graph data"
          git push
