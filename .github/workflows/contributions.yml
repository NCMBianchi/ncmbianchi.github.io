name: Update contribution graph data

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch contribution calendar
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GITHUB_LOGIN: NCMBianchi
        run: cargo run --release --manifest-path tools/contrib-graph/Cargo.toml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/contributions.json
          git diff --cached --quiet || git commit -m "chore: update contribution graph data"
          git push
